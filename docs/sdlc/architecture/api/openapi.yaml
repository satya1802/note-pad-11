    post:
      summary: Ends the current session by revoking its token.
      description: Ends the current session by revoking its token.
      operationId: post_auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: none
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /auth/register:
    post:
      summary: Self-register with email and password; rejects duplicate email and
